<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Vortex & 3D Cubes Scroll Animation</title>
</head>
<body>

    <!-- Cubos 3D de fondo -->
    <div class="cubes-bg">
        <div class="cube c1">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube c2">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube c3">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="cube c4">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>

    <!-- Triángulos en vórtice -->
    <div class="container">
        <div class="polygon top"></div>
        <div class="polygon left"></div>
        <div class="polygon right"></div>
        <div class="polygon bottom"></div>
    </div>

    <!-- Texto Neón Revelado -->
    <div class="text-wrapper">
        <p class="text">Do I wanna Know?
        </p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Intentando Login</title>
    <link rel="stylesheet" href="intentando_login.css">
    <link rel="stylesheer" href="../propiedades_de_texto_CSS/fonts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="box-login">
            
        <img class="logo-imagen" src="../imagenes/ds.png">   
        <h1>Iniciar Sesion</h1>
        <p>Inicia Sesion en este nuevo mundo</p>
        <form class="forms">
            <input type="email" name="email" class="input" input" placeholder="correo">
            <input type="password" name="contraseña" class="input" required placeholder="contraseña">
            <input type="submit" id="submit" placeholder="Enviar">
            <a href="nacho_weko.html">No tienes Contraseña?</a>
        </form>

        <!-- copiado de internet -->
        <div class="social-login">
            <p class="divider">O inicia sesión con</p>
            <div class="social-buttons">
                <button class="btn-social btn-facebook">
                <i class="fa-brands fa-facebook-f"></i> Facebook
                </button>
                <button class="btn-social btn-google">
                <i class="fa-brands fa-google"></i> Google
                </button>
            </div>
        </div>
    </div>
</body>
</html>

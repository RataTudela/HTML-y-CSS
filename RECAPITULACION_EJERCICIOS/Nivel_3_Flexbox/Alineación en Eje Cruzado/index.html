<!-- Configura un contenedor 
    flex con dirección en fila (flex-direction: row) y align-items: center. 
    Aplica a una de las cajas hijas de forma individual 
    la propiedad align-self: flex-end para romper la alineación del padre.   -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title> 
</head>
<body>
    <div class="contenedor">
        <div class="flex-items"></div>
        <div class="flex-items self--align"></div>
        <div class="flex-items"></div>
    </div>
</body>
</html>

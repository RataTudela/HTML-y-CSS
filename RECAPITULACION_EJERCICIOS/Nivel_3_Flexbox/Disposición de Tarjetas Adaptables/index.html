<!-- Disposición de Tarjetas Adaptables: Crea un contenedor con 
    display: flex, flex-wrap: wrap y justify-content: space-evenly. 
    Inserta tres tarjetas hijas configurando 
    la propiedad abreviada flex: 1 1 300px (grow, shrink, basis) 
    y max-width: 100% para garantizar que se ajusten en pantallas pequeñas. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title> 
</head>
<body>
    <div class="flex">
        <div class="tarjeta shrink"></div>
        <div class="tarjeta grow"></div>
        <div class="tarjeta basis"></div>
    </div>
</body>
</html>

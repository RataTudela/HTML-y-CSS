
<!-- Define un contenedor hijo con 
    container-type: inline-size y asigna un nombre 
    mediante container-name: tarjeta.
    Crea una regla @container tarjeta 
    (max-width: 500px) que cambie la orientación 
    interna de la tarjeta de 
    flex-direction: row a column únicamente cuando
    su contenedor padre sea estrecho.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="tarjeta-wrapper"> 
        <div class="tarjeta">    
            <div class="contenido">Texto de la tarjeta</div>
        </div>
    </div>
</body>
</html>

<!--  Crea un archivo index.html utilizando el atajo html:5.
    Agrega un encabezado principal <h1> 
    (recordando usar solo uno por página), 
    un párrafo <p> con texto en negrita <b> 
    y una lista desordenada <ul> con 3 enlaces.
    Configura los enlaces para que abran en una pestaña 
    nueva de forma segura mediante target="_blank" y rel="noopener".   -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Encabezado Principal</h1>
    <p><b>Este es un párrafo con texto en negrita.</b></p>
    <ul>
        <li><a href="https://google.com" target="_blank" rel="noopener">GOOGLE</a></li>
        <li><a href="https://facebook.com" target="_blank" rel="noopener">FACEBOOK</a></li>
        <li><a href="https://youtube.com" target="_blank" rel="noopener">youtube</a></li>
    </ul>
</body>
</html>

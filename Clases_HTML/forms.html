<!DOCTYPE html>
<head>
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <forms>
        <input type="text" required placeholder="Nombre" name="nombre" minlength="3" maxlength="10">
        <input type="email" required placeholder="Correo" name="correo">
        <input type="password" required placeholder="Contraseña" name="contraseña">
        <input type="checkbox">
        <input type="radio">
        <input type="file">
        <input type="date">
        <input type="submit">
    </forms>
</body>
</html>
